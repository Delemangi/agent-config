approval_policy = "never"

default_permissions = ":danger-full-access"

model = "gpt-6.2-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "auto"

# Keep repository instructions shared with Claude and other tools.
project_doc_fallback_filenames = ["CLAUDE.md"]

review_model = "gpt-6.2-astra"

[agents]
default_subagent_model = "gpt-6.2-sol"

[features]
hooks = true
memories = true
multi_agent_v2 = true

# Codex generates [hooks.state] trust records locally. Do not publish them.
